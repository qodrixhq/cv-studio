<section class="guide"><h2 data-bn="CV লেখার সহজ গাইড" data-en="Simple CV writing guide"></h2>
 <details><summary data-bn="ফ্রেশারদের CV কীভাবে লিখবেন" data-en="How a fresher should write a CV"></summary><p data-bn="অভিজ্ঞতা না থাকলে শিক্ষা, প্রজেক্ট, সার্টিফিকেট, ইন্টারনশিপ ও সংগঠনের কাজ সামনে আনুন। সারসংক্ষেপে আপনার লক্ষ্য দুই লাইনে লিখুন। দক্ষতা ও ভাষা সত্যিকারের স্তর অনুযায়ী বেছে নিন।" data-en="With no experience, lead with education, projects, certificates, internships and club work. State your goal in two lines in the summary. Pick skills and languages at the level you really have."></p></details>
 <details><summary data-bn="ছবি দেবেন কি?" data-en="Should you add a photo?"></summary><p data-bn="অনেক বাংলাদেশি নিয়োগকর্তা ছবি আশা করেন, তাই পরিষ্কার ও সাধারণ পোশাকের ছবি দিন। বিদেশি কোম্পানির আবেদনে সাধারণত ছবি ছাড়া CV-ই নিরাপদ। জানা থাকলে নিয়োগ বিজ্ঞপ্তি দেখে নিন।" data-en="Many Bangladeshi employers expect a photo, so use a clear one in plain clothes. For applications to foreign companies a CV without a photo is usually safer. Check the job notice if it says anything."></p></details>
 <details><summary data-bn="ATS ফ্রেন্ডলি CV কী?" data-en="What is an ATS friendly CV?"></summary><p data-bn="অনেক কোম্পানি CV পড়তে সফটওয়্যার ব্যবহার করে। ক্লাসিক বা সাদামাটা টেমপ্লেট বেছে 'প্রিন্ট করে PDF' বাটন ব্যবহার করলে লেখা সিলেক্ট করা যায়, সফটওয়্যার সহজে পড়তে পারে। সাধারণ PDF ডাউনলোড ছবির মতো, তাই সফটওয়্যার তা পড়তে পারে না।" data-en="Many companies use software to read CVs. Pick the Classic or Minimal template and use the Print to PDF button, which keeps the text selectable and easy for software to read. The normal PDF download is an image, so software cannot read it."></p></details></section>
