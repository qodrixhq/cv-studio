<section class="guide tool"><div class="phd"><i class="phi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/></svg></i><h2 data-bn="CV লেখার সহজ গাইড" data-en="Simple CV writing guide"></h2></div>
<div class="gh rv"><div class="gh-e" data-bn="৫ মিনিটে শিখুন" data-en="Learn in 5 minutes"></div><h3 data-bn="ভালো CV-র ৫টা নিয়ম" data-en="5 rules of a good CV"></h3><p data-bn="এগুলো মানলে নিয়োগকর্তার চোখে আপনার CV আলাদা হবে।" data-en="Follow these and your CV stands out to employers."></p></div>
<ol class="gr"><li class="rv"><span class="gn">1</span><div><b data-bn="এক পেজেই গুছিয়ে লিখুন" data-en="Keep it to one clean page"></b><p data-bn="ফ্রেশার হলে এক পেজ যথেষ্ট। দরকারি তথ্যই রাখুন।" data-en="Freshers: one page is enough. Keep only what matters."></p></div></li><li class="rv"><span class="gn">2</span><div><b data-bn="পদ অনুযায়ী CV বদলান" data-en="Tailor it to the job"></b><p data-bn="বিজ্ঞপ্তির কীওয়ার্ড CV-তে রাখুন, ATS পেজে মিলিয়ে দেখুন।" data-en="Use words from the job notice and check the match on the ATS page."></p></div></li><li class="rv"><span class="gn">3</span><div><b data-bn="সংখ্যা দিয়ে অর্জন লিখুন" data-en="Show results with numbers"></b><p data-bn="“বিক্রি বাড়িয়েছি”-র বদলে “বিক্রি ৪০% বাড়িয়েছি” লিখুন।" data-en="Write “grew sales by 40%” instead of “grew sales”."></p></div></li><li class="rv"><span class="gn">4</span><div><b data-bn="সহজ ফন্ট আর ফরম্যাট" data-en="Simple fonts and layout"></b><p data-bn="জটিল ডিজাইন ATS পড়তে পারে না। ক্লাসিক বা মিনিমাল বেছে নিন।" data-en="Fancy layouts confuse ATS. Pick Classic or Minimal."></p></div></li><li class="rv"><span class="gn">5</span><div><b data-bn="পাঠানোর আগে বানান দেখুন" data-en="Proofread before sending"></b><p data-bn="নাম, ইমেইল আর ফোন নম্বর আবার মিলিয়ে নিন।" data-en="Re-check your name, email and phone number."></p></div></li></ol>
<div class="gdd rv"><div class="gd ok"><b data-bn="করুন" data-en="Do"></b><ul><li data-bn="কাজ দিয়ে শুরু করুন: “করেছি”, “বানিয়েছি”" data-en="Start with action words: “built”, “led”"></li><li data-bn="প্রফেশনাল ইমেইল ব্যবহার করুন" data-en="Use a professional email"></li><li data-bn="PDF হিসেবে পাঠান" data-en="Send it as a PDF"></li><li data-bn="সর্বশেষ কাজ আগে লিখুন" data-en="Put your latest job first"></li></ul></div><div class="gd no"><b data-bn="করবেন না" data-en="Don't"></b><ul><li data-bn="ভুয়া তথ্য দেবেন না" data-en="Do not add false information"></li><li data-bn="বেশি রং আর ছবি দেবেন না" data-en="Avoid too many colours and images"></li><li data-bn="NID নম্বর দেবেন না" data-en="Do not share your NID number"></li><li data-bn="লম্বা বাক্য লিখবেন না" data-en="Avoid long sentences"></li></ul></div></div>
<div class="gck rv"><div class="gck-h"><b data-bn="আমার CV চেকলিস্ট" data-en="My CV checklist"></b><span id="gcn">0 / 6</span></div><div class="gck-b"><i id="gcb"></i></div><ul><li role="checkbox" tabindex="0" aria-checked="false" data-k="n"><i></i><span data-bn="নাম, ফোন আর ইমেইল ঠিক আছে" data-en="Name, phone and email are correct"></span></li><li role="checkbox" tabindex="0" aria-checked="false" data-k="s"><i></i><span data-bn="সারসংক্ষেপ ২-৩ লাইনে লেখা" data-en="Summary is 2 to 3 lines"></span></li><li role="checkbox" tabindex="0" aria-checked="false" data-k="u"><i></i><span data-bn="কাজের বিবরণে সংখ্যা আছে" data-en="Work entries include numbers"></span></li><li role="checkbox" tabindex="0" aria-checked="false" data-k="k"><i></i><span data-bn="৫টা বা বেশি দক্ষতা আছে" data-en="At least 5 skills listed"></span></li><li role="checkbox" tabindex="0" aria-checked="false" data-k="p"><i></i><span data-bn="বানান আর তারিখ মিলিয়েছি" data-en="Spelling and dates checked"></span></li><li role="checkbox" tabindex="0" aria-checked="false" data-k="d"><i></i><span data-bn="PDF হিসেবে সেভ করেছি" data-en="Saved as PDF"></span></li></ul><div class="gck-d" id="gcd" hidden data-bn="🎉 প্রস্তুত! এবার আবেদন করুন।" data-en="🎉 You are ready. Time to apply!"></div></div>
<h3 class="gq" data-bn="সাধারণ প্রশ্ন" data-en="Common questions"></h3>
<details><summary data-bn="ফ্রেশারদের CV কীভাবে লিখবেন" data-en="How a fresher should write a CV"></summary><p data-bn="অভিজ্ঞতা না থাকলে শিক্ষা, প্রজেক্ট, সার্টিফিকেট, ইন্টারনশিপ ও সংগঠনের কাজ সামনে আনুন। সারসংক্ষেপে আপনার লক্ষ্য দুই লাইনে লিখুন। দক্ষতা ও ভাষা সত্যিকারের স্তর অনুযায়ী বেছে নিন।" data-en="With no experience, lead with education, projects, certificates, internships and club work. State your goal in two lines in the summary. Pick skills and languages at the level you really have."></p></details><details><summary data-bn="ছবি দেবেন কি?" data-en="Should you add a photo?"></summary><p data-bn="অনেক বাংলাদেশি নিয়োগকর্তা ছবি আশা করেন, তাই পরিষ্কার ও সাধারণ পোশাকের ছবি দিন। বিদেশি কোম্পানির আবেদনে সাধারণত ছবি ছাড়া CV-ই নিরাপদ। জানা থাকলে নিয়োগ বিজ্ঞপ্তি দেখে নিন।" data-en="Many Bangladeshi employers expect a photo, so use a clear one in plain clothes. For applications to foreign companies a CV without a photo is usually safer. Check the job notice if it says anything."></p></details><details><summary data-bn="ATS ফ্রেন্ডলি CV কী?" data-en="What is an ATS friendly CV?"></summary><p data-bn="অনেক কোম্পানি CV পড়তে সফটওয়্যার ব্যবহার করে। ক্লাসিক বা সাদামাটা টেমপ্লেট বেছে 'প্রিন্ট করে PDF' বাটন ব্যবহার করলে লেখা সিলেক্ট করা যায়, সফটওয়্যার সহজে পড়তে পারে। সাধারণ PDF ডাউনলোড ছবির মতো, তাই সফটওয়্যার তা পড়তে পারে না।" data-en="Many companies use software to read CVs. Pick the Classic or Minimal template and use the Print to PDF button, which keeps the text selectable and easy for software to read. The normal PDF download is an image, so software cannot read it."></p></details>

<script>(function(){var K="cvgl",st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}var it=[].slice.call(document.querySelectorAll(".gck li"));function up(){var n=0;it.forEach(function(l){var on=!!st[l.dataset.k];l.classList.toggle("on",on);l.setAttribute("aria-checked",on);if(on)n++});document.getElementById("gcn").textContent=n+" / "+it.length;document.getElementById("gcb").style.width=(n/it.length*100)+"%";document.getElementById("gcd").hidden=n<it.length}function tg(l){st[l.dataset.k]=!st[l.dataset.k];try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}up()}it.forEach(function(l){l.addEventListener("click",function(){tg(l)});l.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();tg(l)}})});up()})()</script>
