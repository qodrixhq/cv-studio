<article class="mc rv" id="build"><div class="mh"><span class="gn">1</span><h3 data-bn="CV বানান: ৭টা ধাপ" data-en="Build your CV in 7 steps"></h3></div>
<div class="md"><svg viewBox="0 0 280 60" width="280" height="60" role="img" aria-label="7 steps"><path d="M22 30H258" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/><g font-size="13" font-weight="700" text-anchor="middle"><circle cx="22" cy="30" r="14" fill="var(--brand)"/><text x="22" y="35" fill="var(--bi)">1</text><circle cx="61" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="61" y="35" fill="var(--brand)">2</text><circle cx="101" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="101" y="35" fill="var(--brand)">3</text><circle cx="140" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="140" y="35" fill="var(--brand)">4</text><circle cx="179" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="179" y="35" fill="var(--brand)">5</text><circle cx="219" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="219" y="35" fill="var(--brand)">6</text><circle cx="258" cy="30" r="14" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"/><text x="258" y="35" fill="var(--brand)">7</text></g></svg></div>
<p data-bn="বিল্ডারের ওপরে ধাপগুলো সাজানো: পরিচয়, অভিজ্ঞতা, শিক্ষা, দক্ষতা, AI, আরও আর ডিজাইন। নিচের “পরের ধাপ” বাটনে এগোন, আর ওপরের ধাপে ট্যাপ করে যেকোনো ধাপে ফিরুন।" data-en="The steps run along the top of the builder: Profile, Work, Education, Skills, AI, More and Design. Use “Next step” to move on, or tap a step at the top to jump back."></p>
<ul><li data-bn="টাইপ করলেই অটো-সেভ হয়, আলাদা সেভ বাটন নেই।" data-en="Everything auto-saves as you type. There is no save button."></li><li data-bn="ফ্রেশার হলে “ফ্রেশার” বাছুন। অভিজ্ঞতার ঘর ফাঁকা থাকবে আর CV-তে Fresher লেখা আসবে।" data-en="If you are a fresher, pick “Fresher”. The experience section stays empty and your CV shows Fresher."></li><li data-bn="কোম্পানি বা প্রতিষ্ঠানের নাম লিখলে সাজেশন আসে। সাজেশন থেকে বাছুন, না পেলে নতুন নামটা যোগ করুন।" data-en="Suggestions appear as you type a company or institution. Pick one, or add your own name if it is not listed."></li><li data-bn="তারিখ মাস আর বছরের ড্রপডাউন থেকে বাছুন। পড়া শেষ হলে ফলাফল দিতে হয়।" data-en="Pick dates from the month and year dropdowns. Once a degree is finished, add the result."></li><li data-bn="যা নেই তা ফাঁকা রাখুন, CV-তে সেই সেকশন আসবে না।" data-en="Leave out what you do not have. Empty sections do not appear on the CV."></li><li data-bn="আগে দেখে নিতে চান? শেষ ধাপের নিচে “নমুনা তথ্য দিয়ে দেখুন” চাপুন।" data-en="Want a preview first? At the bottom of the last step tap “Try with sample data”."></li></ul></article>

<article class="mc rv" id="preview"><div class="mh"><span class="gn">2</span><h3 data-bn="এডিট আর প্রিভিউ" data-en="Edit and preview"></h3></div>
<div class="md"><svg viewBox="0 0 280 64" width="280" height="64" role="img" aria-label="Edit and preview"><rect x="60" y="14" width="160" height="36" rx="18" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><rect x="64" y="18" width="76" height="28" rx="14" fill="var(--brand)"/><g transform="translate(88 21) scale(.92)" fill="none" stroke="var(--bi)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></g><g transform="translate(168 21) scale(.92)" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></svg></div>
<p data-bn="ফোন আর ট্যাবলেটে নিচের বারে “এডিট” ও “প্রিভিউ” ট্যাব আছে। প্রিভিউতে CV আসল পেজের মতো দেখায়। ডানে বা বাঁয়ে সোয়াইপ করেও ট্যাব বদলানো যায়। ডেস্কটপে দুটো পাশাপাশি থাকে।" data-en="On phones and tablets the bottom bar has Edit and Preview tabs. Preview shows your CV like the real page. You can also swipe left or right to switch. On desktop both sit side by side."></p>
<ul><li data-bn="“CV-র মান” স্কোর আর কী যোগ করলে ভালো হয় তার টিপস প্রিভিউর ওপরে দেখা যায়।" data-en="The CV strength score and tips on what to add appear above the preview."></li><li data-bn="লেখা পেজের বাইরে গেলে নিজে থেকে পরের পেজে যায়, কোনো তথ্য মাঝখানে কাটে না।" data-en="If content runs past the page it moves to the next page, and nothing is cut in the middle."></li></ul></article>

<article class="mc rv" id="design"><div class="mh"><span class="gn">3</span><h3 data-bn="টেমপ্লেট, রং আর পেজ" data-en="Templates, colours and page"></h3></div>
<div class="md"><svg viewBox="0 0 280 84" width="280" height="84" role="img" aria-label="Templates and colours"><g><rect x="8" y="8" width="48" height="68" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><rect x="8" y="8" width="16" height="68" rx="6" fill="var(--brand)"/><path d="M32 22h18M32 32h18M32 42h14M32 52h18" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/></g><g><rect x="64" y="8" width="48" height="68" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M72 20h24" stroke="var(--mute)" stroke-width="4" stroke-linecap="round"/><path d="M72 28h32" stroke="var(--brand)" stroke-width="2"/><path d="M72 40h32M72 49h26M72 58h32" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/></g><g><rect x="120" y="8" width="48" height="68" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M126 8h36a6 6 0 016 6v14h-48V14a6 6 0 016-6z" fill="var(--brand)"/><path d="M128 42h32M128 51h26M128 60h32" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="196" cy="22" r="9" fill="#2563EB"/><circle cx="222" cy="22" r="9" fill="#7C3AED"/><circle cx="248" cy="22" r="9" fill="#059669"/><circle cx="196" cy="50" r="9" fill="#DC2626"/><circle cx="222" cy="50" r="9" fill="#D97706"/><circle cx="248" cy="50" r="9" fill="var(--panel)" stroke="var(--mute)" stroke-width="2"/><path d="M248 46v8M244 50h8" stroke="var(--mute)" stroke-width="2" stroke-linecap="round"/></g></svg></div>
<p data-bn="শেষ ধাপ “ডিজাইন”-এ ১৫টা টেমপ্লেট লাইভ প্রিভিউসহ আছে। একটা বাছলে CV সাথে সাথে বদলে যায়।" data-en="The last step, Design, has 15 templates with live previews. Pick one and your CV changes right away."></p>
<ul><li data-bn="১২টা রঙের প্যালেট আছে, আর + চেপে নিজের পছন্দের রং বাছতে পারেন।" data-en="Choose from 12 colour palettes, or tap + to pick your own colour."></li><li data-bn="পেজের সাইজ: A4, Letter, Legal বা A5।" data-en="Page size: A4, Letter, Legal or A5."></li><li data-bn="“আরও কাস্টমাইজ”-এ ফন্ট, ছবির স্টাইল, সেকশনের ক্রম, স্পেসিং আর লেখার আকার বদলানো যায়।" data-en="“More options” lets you change the font, photo style, section order, spacing and text size."></li><li data-bn="অনলাইনে বা ATS-এ পাঠালে ক্লাসিক বা সাদামাটা টেমপ্লেট সবচেয়ে নিরাপদ।" data-en="For online applications and ATS, the Classic or Minimal template is the safest."></li></ul></article>

<article class="mc rv" id="export"><div class="mh"><span class="gn">4</span><h3 data-bn="PDF ও Word ডাউনলোড" data-en="Download PDF and Word"></h3></div>
<div class="md"><svg viewBox="0 0 280 84" width="280" height="84" role="img" aria-label="PDF and Word"><g><path d="M72 8h30l14 14v50a4 4 0 01-4 4H72a4 4 0 01-4-4V12a4 4 0 014-4z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M102 8v14h14" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="74" y="40" width="36" height="18" rx="4" fill="#DC2626"/><text x="92" y="53" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">PDF</text></g><g><path d="M164 8h30l14 14v50a4 4 0 01-4 4h-40a4 4 0 01-4-4V12a4 4 0 014-4z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M194 8v14h14" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="166" y="40" width="36" height="18" rx="4" fill="#2563EB"/><text x="184" y="53" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">DOCX</text></g><g fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M140 28v26"/><path d="M131 46l9 9 9-9"/></g></svg></div>
<p data-bn="ফোন বা ট্যাবলেটে ওপরের ডান কোণের “PDF করুন” বাটন চাপুন। ডেস্কটপে প্রিভিউর নিচের বারে “PDF নামান” আর “Word” আছে।" data-en="On a phone or tablet tap the “Get PDF” button in the top right corner. On desktop the bar under the preview has “Download PDF” and “Word”."></p>
<ul><li data-bn="Word (.docx) আর “প্রিন্ট করে PDF” বাটন ডিজাইন ধাপের নিচে আছে।" data-en="Word (.docx) and “Print to PDF” are at the bottom of the Design step."></li><li data-bn="ATS বা অনলাইন ফর্মে পাঠালে “প্রিন্ট করে PDF” ব্যবহার করুন। এতে লেখা সিলেক্ট করা যায়, সফটওয়্যার সহজে পড়ে। সাধারণ PDF ছবির মতো হয়।" data-en="For ATS or online forms use “Print to PDF”. The text stays selectable and software reads it easily. The normal PDF is an image."></li><li data-bn="কোনো অভিজ্ঞতা বা শিক্ষার তথ্য অসম্পূর্ণ থাকলে অ্যাপ আপনাকে ঠিক করতে সেই ধাপে নিয়ে যাবে।" data-en="If a work or education entry is incomplete, the app takes you to that step to fix it first."></li><li data-bn="PDF বা Word বানাতে ইন্টারনেট লাগে।" data-en="You need an internet connection to create a PDF or Word file."></li></ul></article>

<article class="mc rv" id="ats"><div class="mh"><span class="gn">5</span><h3 data-bn="ATS ও কিওয়ার্ড চেক" data-en="ATS and keyword check"></h3></div>
<div class="md"><svg viewBox="0 0 280 84" width="280" height="84" role="img" aria-label="ATS score"><path pathLength="100" d="M80 72A60 60 0 0 1 200 72" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/><path pathLength="100" d="M80 72A60 60 0 0 1 200 72" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="76 100"/><text x="140" y="62" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink)">ATS</text><g transform="translate(212 52)"><circle cx="8" cy="8" r="8" fill="#16A34A"/><path d="M4.5 8.5l2.5 2.5 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>
<p data-bn="ATS পেজে আপনার সেভ করা CV-র স্কোর দেখা যায়, সাথে কোনটা ঠিক আছে আর কোনটা ঠিক করতে হবে তার তালিকা। CV না থাকলে আগে বানিয়ে নিন।" data-en="The ATS page scores your saved CV and lists what passed and what to fix. Build a CV first if you have none."></p>
<ul><li data-bn="চাকরির বিজ্ঞপ্তির লেখা পেস্ট করলে কীওয়ার্ড মেলানো হয়: ✅ CV-তে আছে, 🟡 শব্দ আছে কিন্তু একসাথে নেই, ⚠️ CV-তে নেই।" data-en="Paste a job notice to match keywords: ✅ in your CV, 🟡 the words are there but not together, ⚠️ missing from your CV."></li><li data-bn="যেগুলো সত্যিই আপনার আছে শুধু সেগুলোই দক্ষতা বা অভিজ্ঞতায় যোগ করুন। পেস্ট করা লেখা কোথাও পাঠানো হয় না।" data-en="Add only the keywords that are really true for you. The pasted text is never sent anywhere."></li><li data-bn="বিজ্ঞপ্তি হাতে না থাকলে “নমুনা বিজ্ঞপ্তি দিয়ে দেখুন” চাপুন।" data-en="No notice at hand? Tap “Try a sample notice”."></li></ul></article>

<article class="mc rv" id="letter"><div class="mh"><span class="gn">6</span><h3 data-bn="কভার লেটার" data-en="Cover letter"></h3></div>
<div class="md"><svg viewBox="0 0 280 84" width="280" height="84" role="img" aria-label="Cover letter"><g><rect x="52" y="10" width="56" height="64" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M62 24h36M62 34h36M62 44h28M62 54h34" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/></g><g fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M120 42h24"/><path d="M137 35l7 7-7 7"/></g><g><rect x="160" y="20" width="68" height="46" rx="8" fill="var(--panel)" stroke="var(--brand)" stroke-width="2.5"/><path d="M162 24l32 24 32-24" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>
<p data-bn="কভার লেটার পেজে কোম্পানির নাম আর পদ লিখুন, তারপর সুর বাছুন: আনুষ্ঠানিক, আত্মবিশ্বাসী বা সহজ ও সরল।" data-en="On the cover letter page enter the company and position, then pick a tone: formal, confident or simple."></p>
<ul><li data-bn="“চিঠি সাজান” চাপলে আপনার CV-র তথ্য থেকে চিঠি তৈরি হয়। আবার চাপলে নতুন ধাঁচের চিঠি আসে।" data-en="“Write letter” builds a letter from your CV details. Press it again for a different version."></li><li data-bn="চিঠির ঘরে নিজের মতো বদলে নিন, তারপর “কপি করুন” বা “ডাউনলোড (.txt)” চাপুন।" data-en="Edit the letter your way, then tap “Copy” or “Download (.txt)”."></li><li data-bn="পদ ফাঁকা রাখলে CV-র পদটাই বসবে।" data-en="Leave the position empty and your CV title is used."></li></ul></article>

<article class="mc rv" id="install"><div class="mh"><span class="gn">7</span><h3 data-bn="অ্যাপ হিসেবে ইনস্টল" data-en="Install as an app"></h3></div>
<p data-bn="প্লে স্টোর বা অ্যাপ স্টোরে যেতে হবে না। ওয়েবসাইট থেকেই হোম স্ক্রিনে অ্যাপের আইকন বসাতে পারবেন, আর অ্যাপটা ফুল স্ক্রিনে খুলবে।" data-en="No app store needed. Add the app icon to your home screen straight from the website, and it opens full screen."></p>
<div class="mcta"><button type="button" class="btn p" data-ins hidden data-bn="এখনই ইনস্টল করুন" data-en="Install now"></button><span class="mok" data-insdone hidden data-bn="✓ অ্যাপ ইনস্টল করা আছে" data-en="✓ App is installed"></span></div>
<div class="mpf"><div><h4>Android</h4><div class="md"><svg viewBox="0 0 140 90" width="140" height="90" role="img" aria-label="Android install"><rect x="40" y="4" width="60" height="82" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><rect x="46" y="10" width="48" height="10" rx="5" fill="var(--soft)"/><g fill="var(--brand)"><circle cx="88" cy="12" r="1.5"/><circle cx="88" cy="15" r="1.5"/><circle cx="88" cy="18" r="1.5"/></g><rect x="56" y="24" width="40" height="34" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><path d="M62 31h22M62 50h22" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/><rect x="58" y="36" width="36" height="10" rx="4" fill="var(--brand)"/><path d="M63 41h20" stroke="var(--bi)" stroke-width="3" stroke-linecap="round"/></svg></div><ol class="ist"><li data-bn="Chrome-এ এই সাইট খুলুন" data-en="Open this site in Chrome"></li><li data-bn="ওপরের “ইনস্টল” বাটন চাপুন, তারপর “Install”। বাটন না এলে ⋮ মেনু থেকে “Install app” বাছুন।" data-en="Tap the Install button above, then “Install”. If it does not appear, use the ⋮ menu and choose “Install app”."></li><li data-bn="হোম স্ক্রিনের আইকন থেকে অ্যাপ খুলুন" data-en="Open the app from the home screen icon"></li></ol></div>
<div><h4>iPhone</h4><div class="md"><svg viewBox="0 0 140 90" width="140" height="90" role="img" aria-label="iPhone install"><rect x="40" y="4" width="60" height="82" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><rect x="46" y="62" width="48" height="18" rx="6" fill="var(--soft)"/><g transform="translate(60 63) scale(.66)" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></g><rect x="50" y="22" width="40" height="30" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><g transform="translate(58 27) scale(.7)" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></g><path d="M74 33h12M74 41h12" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/></svg></div><ol class="ist"><li data-bn="Safari-তে (বা Chrome-এ) এই সাইট খুলুন" data-en="Open this site in Safari (or Chrome)"></li><li data-bn="Share বাটনে ট্যাপ করুন, তারপর “Add to Home Screen” বাছুন" data-en="Tap the Share button, then choose “Add to Home Screen”"></li><li data-bn="“Add” চাপুন। হোম স্ক্রিনে CV Studio আইকন চলে আসবে।" data-en="Tap “Add”. The CV Studio icon appears on your home screen."></li></ol></div></div>
<div class="insn" data-bn="ফেসবুক বা মেসেঞ্জারের ভেতরের ব্রাউজারে ইনস্টল হয় না। মেনু (⋮ বা ···) থেকে “ব্রাউজারে খুলুন” চাপুন, তারপর ইনস্টল করুন।" data-en="Installing does not work inside the Facebook or Messenger browser. Open its menu (⋮ or ···), tap “Open in browser”, then install."></div></article>

<article class="mc rv" id="save"><div class="mh"><span class="gn">8</span><h3 data-bn="সেভ, ব্যাকআপ আর গোপনীয়তা" data-en="Saving, backup and privacy"></h3></div>
<ul><li data-bn="আপনার CV-র তথ্য শুধু আপনার ফোনের ব্রাউজারে সেভ থাকে।" data-en="Your CV data is saved only in your own browser."></li><li data-bn="ব্রাউজারের ডেটা মুছলে বা ফোন বদলালে তথ্য চলে যাবে। তাই ডিজাইন ধাপের নিচে “ব্যাকআপ নামান (.json)” চেপে ফাইলটা রেখে দিন। নতুন জায়গায় “ব্যাকআপ থেকে ফিরিয়ে আনুন” চাপলেই CV ফিরে আসবে।" data-en="Clearing browser data or switching phones removes it. So tap “Download backup (.json)” at the bottom of the Design step and keep the file. On the new device tap “Restore from backup” to get your CV back."></li><li data-bn="সব মুছে নতুন করে শুরু করতে “সব মুছে নতুন শুরু” চাপুন।" data-en="To start over, tap “Clear everything”."></li></ul><a class="insl" href="privacy.html" data-bn="গোপনীয়তা নীতি পড়ুন →" data-en="Read the privacy policy →"></a></article>

<h3 class="gq" id="faq" data-bn="প্রশ্নোত্তর" data-en="Questions and answers"></h3>
<details><summary data-bn="ইনস্টল বাটন দেখছি না কেন?" data-en="Why do I not see the install button?"></summary><p data-bn="অ্যাপ আগেই ইনস্টল করা থাকলে বা আপনি অ্যাপ থেকেই খুলেছেন, তখন বাটন লুকিয়ে থাকে। ফেসবুক বা মেসেঞ্জারের ভেতরের ব্রাউজারে ইনস্টল হয় না, তাই Chrome বা Safari-তে খুলুন।" data-en="The button is hidden if the app is already installed or you opened the site from the app. Installing does not work inside the Facebook or Messenger browser, so open the site in Chrome or Safari."></p></details>
<details><summary data-bn="ইন্টারনেট ছাড়া চলবে?" data-en="Does it work offline?"></summary><p data-bn="আগে খোলা পেজ কিছুটা অফলাইনে খুলতে পারে। তবে PDF, Word, রিভিউ আর নামের সাজেশনের জন্য ইন্টারনেট লাগে।" data-en="Pages you opened before may open offline. PDF, Word, reviews and name suggestions still need an internet connection."></p></details>
<details><summary data-bn="ফোন বদলালে CV কীভাবে নেব?" data-en="How do I move my CV to a new phone?"></summary><p data-bn="পুরনো ফোনে ডিজাইন ধাপের নিচে “ব্যাকআপ নামান (.json)” চাপুন। ফাইলটা নতুন ফোনে নিয়ে গিয়ে একই জায়গায় “ব্যাকআপ থেকে ফিরিয়ে আনুন” চাপুন।" data-en="On the old phone tap “Download backup (.json)” at the bottom of the Design step. Move the file to the new phone and tap “Restore from backup” in the same place."></p></details>
<details><summary data-bn="বাংলা আর ইংরেজি দুই ভাষাতেই CV হবে?" data-en="Can I make the CV in Bangla and English?"></summary><p data-bn="হ্যাঁ। ওপরের EN বা বাংলা বাটন চাপলে সাইট আর CV-র লেখা সেই ভাষায় বদলে যায়।" data-en="Yes. Tap the EN or বাংলা button at the top and the site and your CV switch to that language."></p></details>
<details><summary data-bn="এটা কি ফ্রি? লগইন লাগে?" data-en="Is it free? Do I need to log in?"></summary><p data-bn="পুরোপুরি ফ্রি, লগইন লাগে না।" data-en="It is completely free and needs no login."></p></details>
<details><summary data-bn="সমস্যা বা পরামর্শ জানাব কোথায়?" data-en="Where can I report a problem or suggest something?"></summary><p data-bn="যোগাযোগ পেজের ফর্মে লিখে পাঠান। আপনার মতামত আমাদের কাজে লাগে।" data-en="Send it through the form on the Contact page. Your feedback helps us improve."></p></details>
