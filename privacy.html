<section class="tool"><div class="phd"><i class="phi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></i><h2 data-bn="গোপনীয়তা নীতি" data-en="Privacy policy"></h2></div><div id="priv"><p data-bn="আপনার CV-র সব তথ্য শুধু আপনার নিজের ফোন বা কম্পিউটারের ব্রাউজারে সেভ থাকে, আমরা সেটা কোনো সার্ভারে পাঠাই না। শুধু একটা ব্যতিক্রম আছে: আপনি তালিকায় না থাকা কোনো কোম্পানি, প্রতিষ্ঠান, পদ বা AI টুলের নাম নতুন করে যোগ করলে ওই নামটুকু (আর কিছু না) আমাদের শেয়ার্ড তালিকায় যায়। মালিক যাচাই করে অনুমোদন দিলে তবেই নামটা অন্যদের সাজেশনে আসে। এই নামের সাথে আপনার নাম, ফোন বা অন্য কোনো তথ্য যায় না। সাজেশন খোঁজার সময় আপনার লেখা নামের অংশটুকু আমাদের ডাটাবেস (Supabase) আর উইকিডেটায় যেতে পারে। ফন্ট গুগল ফন্টস থেকে লোড হয়। ব্রাউজারের ডেটা মুছলে সেভ করা তথ্যও মুছে যাবে।" data-en="All your CV details are saved only in your own browser and are never sent to a server. There is one exception: if you add a company, institution, position or AI tool name that is not in the list, only that name (nothing else) goes to our shared list. It becomes a suggestion for others only after the owner reviews and approves it. Your name, phone or any other detail is never sent with it. While you type, the part of the name you typed may be sent to our database (Supabase) and to Wikidata to find suggestions. Fonts load from Google Fonts. Clearing your browser data erases what you saved."></p></div></section>
